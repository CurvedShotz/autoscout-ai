[project]
name = "autoscout-ai-api"
version = "0.1.0"
description = "Backend foundation for AutoScout AI"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "AutoScout AI Team" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "httpx2>=2.10.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
